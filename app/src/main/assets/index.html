<!DOCTYPE html>
<html lang="he">
<head>
    <meta charset="UTF-8">
    <title>מחשבון פשוט</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f5f5f5; }
        .calc { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); max-width: 300px; margin: auto; }
        #display { width: 100%; height: 40px; font-size: 24px; text-align: right; margin-bottom: 10px; padding: 5px; box-sizing: border-box; }
        .buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        button { height: 50px; font-size: 18px; cursor: pointer; }
        .operator { background: #ff9500; color: white; }
        .equals { background: #ff9500; color: white; grid-column: span 2; }
        .clear { background: #a5a5a5; color: white; }
        .num { background: #eee; }
    </style>
</head>
<body>
<div class="calc">
    <input type="text" id="display" readonly>
    <div class="buttons">
        <button class="clear" onclick="clearDisplay()">C</button>
        <button onclick="append('±')">±</button>
        <button onclick="append('%')">%</button>
        <button class="operator" onclick="append('/')">÷</button>
        <button class="num" onclick="append('7')">7</button>
        <button class="num" onclick="append('8')">8</button>
        <button class="num" onclick="append('9')">9</button>
        <button class="operator" onclick="append('*')">×</button>
        <button class="num" onclick="append('4')">4</button>
        <button class="num" onclick="append('5')">5</button>
        <button class="num" onclick="append('6')">6</button>
        <button class="operator" onclick="append('-')">−</button>
        <button class="num" onclick="append('1')">1</button>
        <button class="num" onclick="append('2')">2</button>
        <button class="num" onclick="append('3')">3</button>
        <button class="operator" onclick="append('+')">+</button>
        <button class="num" onclick="append('0')">0</button>
        <button class="num" onclick="append('.')">.</button>
        <button class="equals" onclick="calculate()">=</button>
    </div>
</div>
<script>
    const display = document.getElementById('display');
    function append(value) {
        display.value += value;
    }
    function clearDisplay() {
        display.value = '';
    }
    function calculate() {
        try {
            // Replace unicode symbols with JS operators
            let expr = display.value
                .replace(/×/g, '*')
                .replace(/÷/g, '/')
                .replace(/−/g, '-')
                .replace(/±/g, '*-1') // simple handling, not perfect
                .replace(/%/g, '/100');
            // Evaluate safely using Function constructor
            const result = new Function('return ' + expr)();
            display.value = result;
        } catch (e) {
            display.value = 'Error';
        }
    }
    // Allow keyboard input
    document.addEventListener('keydown', (e) => {
        if (e.key >= '0' && e.key <= '9') append(e.key);
        if (e.key === '.') append('.');
        if (e.key === '+') append('+');
        if (e.key === '-') append('-');
        if (e.key === '*') append('*');
        if (e.key === '/') append('/');
        if (e.key === 'Enter') calculate();
        if (e.key === 'Escape') clearDisplay();
        if (e.key === 'Backspace') {
            display.value = display.value.slice(0, -1);
        }
    });
</script>
</body>
</html>
